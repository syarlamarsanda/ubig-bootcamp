<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Bento Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bento-container mode-flex">
        <div class="bento-left">
            <div class="bento-item box-gohan">
                <span class="box-number">01</span>
                <h2 class="box-title">Gohan</h2>
            </div>
            <div class="bento-item box-okazu">
                <span class="box-number">03</span>
                <h2 class="box-title">Okazu</h2>
            </div>

            <div class="bento-item box-dessert">
                <span class="box-number">04</span>
                <h2 class="box-title">Dessert</h2>
            </div>
        </div>
        <div class="bento-item box-skewer">
            <span class="box-number">02</span>
            <h2 class="box-title">Skewer</h2>
        </div>
    </div>
</body>
</html>
