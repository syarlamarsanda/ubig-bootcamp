<!DOCTYPE html>
<!--
CATATAN
- liquid layout: lebar pakai persen (%)
- ikut menyesuaikan lebar layar, lebih fleksibel dari fixed width
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Layout</title>
  <style>
body { font-family: Arial; background-color: lightgray; }
.container {
  width: 80%;
  margin: auto;
  background-color: white;
  padding: 20px;
}
  </style>
</head>
<body>
<div class="container">

</html>
