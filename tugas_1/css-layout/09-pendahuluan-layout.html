<!DOCTYPE html>
<!--
CATATAN
- layout = cara menyusun elemen di halaman
- bagian umum: header, menu (nav), konten, footer
- layout yang baik bikin halaman rapi dan gampang dibaca
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>
  <style>
body { font-family: Arial; margin: 0; }
div { padding: 20px; color: white; text-align: center; }
.header { background-color: steelblue; }
.menu { background-color: slategray; }
.konten { background-color: lightgray; color: black; height: 200px; }
.footer { background-color: dimgray; }
  </style>
</head>
<body>
<div class="header">Header</div>
<div class="menu">Menu</div>
<div class="konten">Konten</div>
<div class="footer">Footer</div>
</body>
</html>
