<!DOCTYPE html>
<!--
CATATAN
- responsive layout: tampilan menyesuaikan ukuran layar (PC, tablet, HP)
- WAJIB ada meta viewport di <head>:
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  artinya: lebar halaman = lebar layar perangkat
- tanpa itu, di HP halaman tampil versi desktop yang diperkecil (tulisan jadi kecil banget)
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewport</title>
  <style>
body { font-family: Arial; }
  </style>
</head>
<body>
<h1>Halo dari HP</h1>
<p>Coba buka halaman ini pakai mode HP di DevTools.</p>
</body>
</html>
