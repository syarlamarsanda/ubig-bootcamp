<!DOCTYPE html>
<!--
CATATAN
- fixed width: lebar tetap dalam px (misal 960px)
- tampilannya sama di layar apa pun
- kurangnya: di layar besar kelihatan kecil, di layar kecil muncul scroll ke samping
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Width</title>
  <style>
body { font-family: Arial; background-color: lightgray; }
.container {
  width: 960px;
  margin: auto;
  background-color: white;
  padding: 20px;
}
  </style>
</head>
<body>
<div class="container">
  <h1>Fixed Width 960px</h1>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corporis nisi aut quas ut hic soluta, odit, doloremque maiores ducimus, qui nostrum. Nihil non praesentium cupiditate ratione natus eaque nobis incidunt.</p>
</div>
</body>
</html>
