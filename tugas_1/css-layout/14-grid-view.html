<!DOCTYPE html>
<!--
CATATAN
- grid view: halaman dibagi jadi 12 kolom, lebarnya pakai persen
- col-1 = 1/12 = 8.33%, col-6 = 50%, col-12 = 100%
- box-sizing: border-box biar padding tidak bikin kolom kelebaran
- kolom pakai float: left, baris pakai clearfix (.row::after) biar tidak berantakan
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid View</title>
  <style>
* { box-sizing: border-box; }
body { font-family: Arial; }
.row::after { content: ""; display: table; clear: both; }
[class*="col-"] { float: left; padding: 15px; border: 1px solid white; color: white; }
.col-1 { width: 8.33%; }
.col-2 { width: 16.66%; }
.col-3 { width: 25%; }
.col-4 { width: 33.33%; }
.col-5 { width: 41.66%; }
.col-6 { width: 50%; }
.col-7 { width: 58.33%; }
.col-8 { width: 66.66%; }
.col-9 { width: 75%; }
.col-10 { width: 83.33%; }
.col-11 { width: 91.66%; }
.col-12 { width: 100%; }
.menu { background-color: crimson; }
.konten { background-color: seagreen; }
.a { background-color: steelblue; }
.b { background-color: slategray; }
  </style>
</head>
<body>
<div class="row">
  <div class="col-3 menu">col-3 (Menu)</div>
  <div class="col-9 konten">col-9 (Konten)</div>
</div>
<div class="row">
  <div class="col-4 a">col-4</div>
  <div class="col-4 b">col-4</div>
  <div class="col-4 a">col-4</div>
</div>
</body>
</html>
