<!DOCTYPE html>
<!--
CATATAN
- display: grid -> bagi halaman jadi baris dan kolom kayak tabel
- grid-template-columns : ukuran tiap kolom (fr = bagian dari sisa ruang)
- grid-template-areas : kasih nama tiap area, lalu taruh elemen pakai grid-area
- gap : jarak antar kotak
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>
  <style>
.grid {
  display: grid;
  grid-template-columns: 1fr 3fr;
  grid-template-areas:
    "header header"
    "menu konten"
    "footer footer";
  gap: 10px;
  font-family: Arial;
}
.grid div { padding: 20px; color: white; }
.header { grid-area: header; background-color: steelblue; }
.menu { grid-area: menu; background-color: slategray; }
.konten { grid-area: konten; background-color: seagreen; height: 150px; }
.footer { grid-area: footer; background-color: dimgray; }
  </style>
</head>
<body>
<div class="grid">
  <div class="header">Header</div>
  <div class="menu">Menu</div>
  <div class="konten">Konten</div>
  <div class="footer">Footer</div>
</div>
</body>
</html>
