<!DOCTYPE html>
<!--
CATATAN
- atribut = keterangan tambahan di dalam tag pembuka
- cara nulis: nama="nilai"
- align: left / center / right untuk perataan
  (sekarang jarang dipakai, perataan biasanya lewat CSS)
- atribut lain yang sering muncul: href (link), src (gambar), title
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Attributes</title>
</head>
<body>
<p align="left">Teks ini rata kiri</p>
<p align="center">Teks ini ada di tengah</p>
<p align="right">Teks ini rata kanan</p>
<p title="Muncul saat kursor diarahkan">Arahkan kursor ke sini</p>
</body>
</html>
