<!DOCTYPE html>
<!--
CATATAN
- <audio src="..."> caranya mirip video
- controls : tombol putar, jeda, volume
- autoplay : langsung bunyi waktu halaman dibuka (sering diblok browser)
- loop     : diulang terus
reminder: taro file lagu sendiri di folder ini, namai lagu.mp3
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Audio</title>
</head>
<body>
<audio src="lagu.mp3" controls></audio>
</body>
</html>
