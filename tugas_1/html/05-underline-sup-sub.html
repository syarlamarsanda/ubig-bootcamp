<!DOCTYPE html>
<!--
CATATAN
- <u>   : garis bawah
- <sup> : teks kecil di atas (pangkat), contoh x<sup>2</sup> = x²
- <sub> : teks kecil di bawah, contoh x<sub>1</sub> = x₁
- spasi atau enter berkali-kali tetap dianggap 1 spasi oleh HTML
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Underline Sup Sub</title>
</head>
<body>
<p>Ini teks <u>bergaris bawah</u>.</p>
<p>Rumus luas persegi: s<sup>2</sup></p>
<p>Rumus air: H<sub>2</sub>O</p>
<p>Kata ini        punya banyak spasi


dan enter, tapi tetap tampil satu spasi.</p>
</body>
</html>
