<!DOCTYPE html>
<!--
- <img> tidak punya tag penutup
- src    : lokasi / nama file gambar
- alt    : teks pengganti kalau gambar gagal tampil
- width / height : ukuran gambar
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gambar</title>
</head>
<body>
<img src="KumanMati_2.png" alt="Foto pemandangan" width="300" height="200">
<br>
<img src="KumanMati_2.png" alt="Gambar ini gagal dimuat">
</body>
</html>
