<!DOCTYPE html>
<!--
CATATAN
- <table> : wadah tabel
- <tr> : baris
- <th> : judul kolom (otomatis tebal dan di tengah)
- <td> : isi sel
- colspan="2" : gabung sel ke samping
- rowspan="2" : gabung sel ke bawah
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel</title>
</head>
<body>
<table border="1">
  <tr>
    <th>Nama</th>
    <th>Kelas</th>
    <th>Nilai</th>
  </tr>
  <tr>
    <td>Andi</td>
    <td rowspan="2">XI</td>
    <td>90</td>
  </tr>
  <tr>
    <td>Budi</td>
    <td>85</td>
  </tr>
  <tr>
    <td colspan="3">Sel ini memakan tiga kolom</td>
  </tr>
</table>
</body>
</html>
