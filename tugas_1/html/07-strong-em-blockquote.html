<!DOCTYPE html>
<!--
CATATAN
- <strong> : tampil tebal, artinya penting
- <em>     : tampil miring, artinya ditekankan
- <blockquote> : kutipan, tampil menjorok ke dalam
BEDANYA:
- <b> dan <i> cuma gaya tampilan
- <strong> dan <em> punya makna 
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Strong Emphasis Blockquote</title>
</head>
<body>
<p><b>Ini bold</b> dan <strong>ini strong</strong>, tampilannya sama.</p>
<p><i>Ini italic</i> dan <em>ini emphasis</em>, tampilannya juga sama.</p>

<blockquote>
  Belajar coding itu bukan soal cepat, tapi soal konsisten.
</blockquote>
</body>
</html>
