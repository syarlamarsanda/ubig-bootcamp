<!DOCTYPE html>
<!--
CATATAN
- semua isi dibungkus <html> ... </html>
- <head> : informasi halaman, tidak tampil di layar
  contohnya <title> = judul yang muncul di tab browser
- <body> : semua konten yang kelihatan di layar
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Judul di Tab Browser</title>
</head>
<body>
<h1>Ini bagian body</h1>
<p>Lihat tab browser, judulnya diambil dari tag title di bagian head.</p>
</body>
</html>
