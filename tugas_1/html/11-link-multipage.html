<!DOCTYPE html>
<!--
CATATAN
- link dibuat pakai <a href="tujuan">
- ke website lain: tulis alamat lengkap (https://...)
- ke halaman lain di folder yang sama: tulis nama filenya aja
- target="_blank" : buka di tab baru
- beberapa halaman yang saling terhubung = multi page
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Link</title>
</head>
<body>
<h1>Halaman Utama</h1>
<a href="https://www.google.com" target="_blank">Buka Google (tab baru)</a><br>
<a href="11-profil.html">Ke halaman profil</a>
</body>
</html>
