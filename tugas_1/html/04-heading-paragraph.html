<!DOCTYPE html>
<!--
CATATAN
- comment: contohnya ada di baris pertama dalam body. Tidak tampil di browser.
  Shortcut bikin comment di VS Code: Ctrl + /
- heading: <h1> sampai <h6>. h1 paling besar, h6 paling kecil
- <p>: bikin paragraf terpisah. Teks tanpa <p> bakal nyambung terus ke kanan
- <b>: tebal, buat penanda hal penting
- <i>: miring, biasanya buat kata asing

-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Heading dan Paragraph</title>
</head>
<body>
<!-- ini comment -->
<h1>Heading 1</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>
<h6>Heading 6</h6>

<p>Ini paragraf pertama.</p>
<p>Ini paragraf kedua, posisinya turun ke bawah.</p>

<p>Saya suka <b>belajar coding</b> setiap hari.</p>
<p>Kata <i>website</i> berasal dari bahasa Inggris.</p>
</body>
</html>
