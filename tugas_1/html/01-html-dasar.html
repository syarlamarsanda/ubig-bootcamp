<!DOCTYPE html>
<!--
CATATAN
- HTML (HyperText Markup Language) = bahasa untuk bikin kerangka / pondasi website
- ibarat rumah, HTML itu pondasinya
- dibagi 2 bagian besar: head dan body
- kebanyakan tag punya pembuka dan penutup: <html> ... </html>
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>HTML Dasar</title>
</head>
<body>
<h1>Halo, ini halaman HTML pertamaku</h1>
<p>Semua yang kelihatan di browser ditulis di dalam body.</p>
</body>
</html>
