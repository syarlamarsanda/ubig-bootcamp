<!DOCTYPE html>
<!--
CATATAN
- <ol> : daftar bernomor
- <ul> : daftar berpoin
- <li> : isi tiap item (dipakai di ol dan ul)
- <dl> : daftar istilah. <dt> = istilahnya, <dd> = penjelasannya
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>List</title>
</head>
<body>
<h3>Ordered list</h3>
<ol>
  <li>Bangun tidur</li>
  <li>Mandi</li>
  <li>Berangkat sekolah</li>
</ol>

<h3>Unordered list</h3>
<ul>
  <li>Apel</li>
  <li>Jeruk</li>
</ul>

<h3>Description list</h3>
<dl>
  <dt>HTML</dt>
  <dd>Bahasa untuk menyusun struktur halaman web</dd>
  <dt>CSS</dt>
  <dd>Bahasa untuk mengatur tampilan halaman web</dd>
</dl>
</body>
</html>
