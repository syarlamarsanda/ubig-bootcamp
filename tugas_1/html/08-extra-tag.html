<!DOCTYPE html>
<!--
CATATAN
- <abbr title="..."> : singkatan, arti muncul kalau kursor diarahkan
- <dfn>  : istilah yang lagi dijelasin (tampil miring)
- <acronym> : sudah tidak dipakai di HTML5, ganti pakai <abbr>
- <cite> : judul karya (buku, film, lagu)
- <del>  : teks dicoret / dihapus
- <ins>  : teks ditambahkan (garis bawah)

-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Extra Tag</title>
</head>
<body>
<p><abbr title="HyperText Markup Language">HTML</abbr> adalah bahasa untuk membuat web.</p>
<p><dfn>Tag</dfn> adalah perintah yang ditulis di antara tanda &lt; dan &gt;.</p>
<p>Novel favorit saya adalah <cite>Laskar Pelangi</cite>.</p>
<p>Harga: <del>Rp50.000</del> <ins>Rp35.000</ins></p>
</body>
</html>
