<!DOCTYPE html>
<!--
CATATAN
- <br> : pindah baris (kayak enter). Tidak perlu tag penutup.
  <br> dan <br/> sama aja
- <hr> : garis pembatas horizontal
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Line Break dan Horizontal Rule</title>
</head>
<body>
<p>Baris pertama<br>Baris kedua<br/>Baris ketiga</p>
<hr>
<p>Paragraf ini ada di bawah garis.</p>
</body>
</html>
