<!DOCTYPE html>
<!--
CATATAN
- rgba(merah, hijau, biru, alpha)
- alpha 0 = transparan total, 1 = padat
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Color Alpha</title>
  <style>
.bg {
  background-image: url(foto.jpg);
  background-size: cover;
  padding: 20px;
}
.kotak {
  background-color: rgba(0, 0, 255, 0.5);
  color: white;
  padding: 20px;
}
  </style>
</head>
<body>
<div class="bg">
  <div class="kotak">Kotak biru setengah transparan</div>
</div>
</body>
</html>
