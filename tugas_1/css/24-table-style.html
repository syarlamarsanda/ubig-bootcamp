z<!DOCTYPE html>
<!--
CATATAN
- border-collapse: collapse -> garis tidak dobel
- padding di th/td -> isi tidak mepet
- tr:nth-child(even) -> baris genap (buat zebra striping)
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Table Style</title>
  <style>
table { border-collapse: collapse; }
th, td {
  border: 1px solid black;
  padding: 8px;
}
th { background-color: lightblue; }
tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>
<table>
  <tr><th>Nama</th><th>Kelas</th></tr>
  <tr><td>Andi</td><td>X</td></tr>
  <tr><td>Budi</td><td>XI</td></tr>
  <tr><td>Citra</td><td>XI</td></tr>
  <tr><td>Dewi</td><td>XII</td></tr>
</table>
</body>
</html>
