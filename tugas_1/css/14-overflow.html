<!DOCTYPE html>
<!--
CATATAN
- semua elemen dianggap kotak
- width / height : ukuran kotak
- overflow kalau isi kepanjangan:
  visible (keluar kotak) / hidden (dipotong) / scroll / auto
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Overflow</title>
  <style>
.box {
  width: 200px;
  height: 100px;
  overflow: auto;
  border: 1px solid gray;
}
  </style>
</head>
<body>
<div class="box">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</div>
</body>
</html>
