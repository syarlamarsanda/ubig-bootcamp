<!DOCTYPE html>
<!--
CATATAN
- tag   : p { }        -> semua <p>
- class : .judul { }   -> pakai titik, boleh dipakai banyak elemen
- id    : #header { }  -> pakai pagar, cuma untuk 1 elemen
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Selector</title>
  <style>
p { color: black; }
.judul { font-weight: bold; }
#header { background-color: yellow; }
  </style>
</head>
<body>
<p class="judul">Halo</p>
<p>Paragraf biasa</p>
<div id="header">Ini header</div>
</body>
</html>
