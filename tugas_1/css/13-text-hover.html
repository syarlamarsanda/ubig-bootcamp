<!DOCTYPE html>
<!--
CATATAN
- text-transform : uppercase / lowercase / capitalize
- text-align     : left / center / right / justify
- text-shadow    : geser-x geser-y blur warna
- :hover   -> saat kursor di atasnya
- :active  -> saat diklik
- :visited -> link yang sudah pernah dibuka
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Text dan Hover</title>
  <style>
h1 {
  text-transform: uppercase;
  text-align: center;
  text-shadow: 2px 2px 4px gray;
}
a:hover { color: red; }
a:active { color: orange; }
a:visited { color: purple; }
  </style>
</head>
<body>
<h1>judul halaman</h1>
<a href="#">Arahkan kursor ke sini</a>
</body>
</html>
