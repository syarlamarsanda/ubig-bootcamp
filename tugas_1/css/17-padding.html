<!DOCTYPE html>
<!--
CATATAN
- padding: 20px;           -> semua sisi
- padding: 10px 20px;      -> atas-bawah, kiri-kanan
- padding: 1px 2px 3px 4px -> atas kanan bawah kiri (searah jarum jam)
- padding-top / right / bottom / left -> satu sisi aja
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Padding</title>
  <style>
div {
  border: 1px solid black;
  background-color: #e0f2fe;
  margin-bottom: 10px;
  display: inline-block;
}
.a { padding: 20px; }
.b { padding: 10px 20px; }
.c { padding-top: 5px; }
  </style>
</head>
<body>
<div class="a">padding 20px</div>
<div class="b">padding 10px 20px</div>
<div class="c">padding-top 5px</div>
</body>
</html>
