<!DOCTYPE html>
<!--
CATATAN (dari dalam ke luar)
content -> padding -> border -> margin
- padding : jarak isi ke garis
- border  : garis tepi
- margin  : jarak ke elemen lain
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Box Model</title>
  <style>
.kotak {
  padding: 10px;
  border: 2px solid black;
  margin: 20px;
  background-color: lightblue;
}
  </style>
</head>
<body>
<div class="kotak">Isi kotak</div>
<div class="kotak">Kotak kedua</div>
</body>
</html>
