<!DOCTYPE html>
<!--
CATATAN
- CSS ditulis langsung di tag pakai atribut style
- cepat buat ubah 1 elemen
- kalau dipakai di banyak elemen, kode jadi berantakan
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Inline CSS</title>
</head>
<body>
<p style="color: red;">Teks ini merah</p>
<p>Paragraf lain tetap hitam</p>
</body>
</html>
