<!DOCTYPE html>
<!--
CATATAN
- max-width: 100% + height: auto -> gambar responsif, tidak gepeng
- border-radius: 50% -> gambar bulat (paling pas kalau gambarnya persegi)
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Image Style</title>
  <style>
img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
}
.foto-profil {
  width: 150px;
  border-radius: 50%;
}
  </style>
</head>
<body>
<img src="foto.jpg" alt="Pemandangan">
<br><br>
<img class="foto-profil" src="profil.jpg" alt="Foto profil">
</body>
</html>
