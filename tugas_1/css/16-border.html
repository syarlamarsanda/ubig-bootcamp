<!DOCTYPE html>
<!--
CATATAN
- border: tebal gaya warna;
- gaya: solid / dashed / dotted / double
- border-radius : sudut melengkung (50% = bulat)
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Border</title>
  <style>
.kotak {
  border: 3px dashed red;
  border-radius: 10px;
  padding: 16px;
  width: 250px;
}
  </style>
</head>
<body>
<div class="kotak">Kotak dengan border putus-putus</div>
</body>
</html>
