<!DOCTYPE html>
<!--
CATATAN
- font-family     : jenis huruf
- font-size       : ukuran
- font-weight     : ketebalan (bold)
- font-style      : italic = miring
- text-decoration : underline / overline / line-through / none
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Font</title>
  <style>
p {
  font-family: Verdana;
  font-size: 16px;
  font-weight: bold;
  font-style: italic;
  text-decoration: underline;
}
a {
  text-decoration: none;
}
  </style>
</head>
<body>
<p>Contoh teks paragraf</p>
<a href="#">Ini link tanpa garis bawah</a>
</body>
</html>
