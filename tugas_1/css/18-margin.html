<!DOCTYPE html>
<!--
CATATAN
- cara nulis sama kayak padding
- margin: auto; + width -> elemen jadi di tengah
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Margin</title>
  <style>
.kotak {
  width: 300px;
  margin: auto;
  background-color: lightgreen;
  text-align: center;
}
  </style>
</head>
<body>
<div class="kotak">Kotak ini ada di tengah</div>
</body>
</html>
